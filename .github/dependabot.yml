# Configuration for GitHub Dependabot automated dependency security updates
version: 2
updates:
  # Maintain Gradle dependencies for the Android app
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "03:00"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 5
    reviewers:
      - "a-zangooei"
    commit-message:
      prefix: "build(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "security"

  # Maintain GitHub Actions workflow versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "03:00"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "ci"
      - "dependencies"
