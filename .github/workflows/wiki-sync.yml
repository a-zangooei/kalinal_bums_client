name: Synchronize Docs to GitHub Wiki

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-wiki:
    name: 📚 Sync Documentation to GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone Wiki Repository & Sync Markdown Content
        env:
          WIKI_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: |
          WIKI_DIR="${{ runner.temp }}/wiki_repo"
          mkdir -p "$WIKI_DIR"

          echo "Attempting to clone repository wiki..."
          if git clone "$WIKI_URL" "$WIKI_DIR"; then
            echo "Wiki repository cloned successfully."
          else
            echo "Wiki repository not found or not initialized. Initializing local git repository for wiki..."
            cd "$WIKI_DIR"
            git init -b master
            git remote add origin "$WIKI_URL"
          fi

          cd "$GITHUB_WORKSPACE"
          echo "Copying documentation pages from docs/ to wiki..."

          # Copy all markdown files recursively, preserving file names
          find docs -type f -name "*.md" | while read -r file; do
            filename=$(basename "$file")
            # GitHub Wiki uses Home.md as the landing page
            if [ "$filename" = "README.md" ]; then
              cp "$file" "$WIKI_DIR/Home.md"
            else
              cp "$file" "$WIKI_DIR/$filename"
            fi
          done

          # Also copy image or asset folders if present
          if [ -d "docs/images" ]; then
            cp -r docs/images "$WIKI_DIR/"
          fi

          cd "$WIKI_DIR"
          git add .

          if git diff --staged --quiet; then
            echo "No changes detected in documentation. Wiki is already up to date."
          else
            git commit -m "Auto-sync documentation from /docs (${{ github.sha }})"
            git push origin master || git push origin main || git push origin HEAD:master --force
            echo "Wiki synchronized successfully!"
          fi
