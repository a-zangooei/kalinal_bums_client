name: Android CI & Multi-Device Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Run Unit & Robolectric Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Secrets & Keystore
        run: |
          touch .env
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  build-multi-device:
    name: 📱 Build for All Devices (${{ matrix.target.name }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: universal
            name: Universal APK (All Devices & Phones)
            abi: universal
            description: Installs on any Android phone (ARM64, ARMv7, x86_64, Android 7.0+)
          - id: arm64-v8a
            name: Modern Phones (ARM64-v8a)
            abi: arm64-v8a
            description: Optimized for modern 64-bit Android smartphones & tablets
          - id: armeabi-v7a
            name: Older Devices (ARMv7 32-bit)
            abi: armeabi-v7a
            description: Optimized for older 32-bit Android smartphones
          - id: x86_64
            name: Emulators & Chromebooks (x86_64)
            abi: x86_64
            description: For PC emulators, ChromeOS Chromebooks, and Intel hardware

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Secrets & Keystore
        run: |
          touch .env
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew

      - name: Build APK for ${{ matrix.target.name }}
        run: |
          if [ "${{ matrix.target.abi }}" = "universal" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
            mkdir -p build-output
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Kalinal-Universal-AllDevices-debug.apk
          else
            ./gradlew assembleDebug -Pandroid.injected.build.abi=${{ matrix.target.abi }} --no-daemon --stacktrace
            mkdir -p build-output
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Kalinal-${{ matrix.target.id }}-debug.apk
          fi

      - name: Upload Device APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalinal-${{ matrix.target.id }}-APK
          path: build-output/*.apk
          retention-days: 14

  build-bundle:
    name: 📦 Build Android App Bundle (Google Play & Adaptive Delivery)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Secrets & Keystore
        run: |
          touch .env
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew

      - name: Build Android App Bundle (AAB)
        run: |
          ./gradlew bundleDebug --no-daemon --stacktrace
          mkdir -p bundle-output
          cp app/build/outputs/bundle/debug/app-debug.aab bundle-output/Kalinal-AppBundle-AllDevices.aab

      - name: Generate Device APKs via Bundletool
        run: |
          curl -sSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          java -jar bundletool.jar build-apks \
            --bundle=bundle-output/Kalinal-AppBundle-AllDevices.aab \
            --output=bundle-output/Kalinal-Device-Splits.apks \
            --mode=default
          java -jar bundletool.jar build-apks \
            --bundle=bundle-output/Kalinal-AppBundle-AllDevices.aab \
            --output=bundle-output/Kalinal-Universal-from-bundle.apks \
            --mode=universal
          unzip -q bundle-output/Kalinal-Universal-from-bundle.apks -d bundle-output/extracted_universal || true
          if [ -f "bundle-output/extracted_universal/universal.apk" ]; then
            cp bundle-output/extracted_universal/universal.apk bundle-output/Kalinal-Bundle-Universal.apk
          fi

      - name: Upload Android App Bundle & Split APKS
        uses: actions/upload-artifact@v4
        with:
          name: Kalinal-AppBundle-and-Splits
          path: |
            bundle-output/*.aab
            bundle-output/*.apks
            bundle-output/*.apk
          retention-days: 14

      - name: Summary & Device Compatibility Matrix
        run: |
          echo "## 🚀 Kalinal CI Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "هر بار کامیت جدید ثبت شود، فایل‌های نصبی زیر به صورت خودکار برای انواع دستگاه‌ها ساخته می‌شوند:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| نوع خروجی | معماری / دستگاه هدف | کاربرد |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Universal APK** | تمام پردازنده‌ها (ARM32, ARM64, x86, x86_64) | نصب مستقیم روی هر گوشی اندروید ۷.۰ تا ۱۶ |" >> $GITHUB_STEP_SUMMARY
          echo "| **ARM64-v8a APK** | گوشی‌های مدرن ۶۴ بیتی | اندازه سبک‌تر و اجرای سریع‌تر روی گوشی‌های جدید |" >> $GITHUB_STEP_SUMMARY
          echo "| **ARMv7 APK** | گوشی‌های قدیمی‌تر ۳۲ بیتی | سازگاری با دستگاه‌های قدیمی اندرویدی |" >> $GITHUB_STEP_SUMMARY
          echo "| **x86_64 APK** | شبیه‌سازهای PC و کروم‌بوک‌ها | اجرای سریع در محیط شبیه‌ساز و دستگاه‌های اینتل |" >> $GITHUB_STEP_SUMMARY
          echo "| **Android App Bundle (.aab)** | تمام مدل‌ها و تراکم‌های صفحه‌نمایش | پکیج رسمی گوگل پلی با تحویل پویای ماژول‌ها بر اساس دستگاه کاربر |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 برای دانلود، به بخش **Artifacts** در بالای صفحه اجرای این اکشن مراجعه کنید." >> $GITHUB_STEP_SUMMARY
