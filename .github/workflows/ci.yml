name: Auto Workflow
run-name: "Auto Workflow commit ${{ github.sha }} (#${{ github.run_number }})"

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Job 1: Quality & Unit Tests (First Line of Defense)
  # =========================================================================
  test:
    name: 🧪 Automated Quality & Unit Tests
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=4"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Persistent Canonical Keystore & Environment
        run: |
          touch .env
          if [ -f "debug.keystore.base64" ]; then
            echo "Loading keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "Loading keystore from GitHub Secret DEBUG_KEYSTORE_BASE64..."
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          else
            echo "Restoring canonical project debug keystore from embedded signature..."
            echo "" | base64 -d > debug.keystore
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Parse & Generate Dynamic Test Report Summary
        if: always()
        run: python3 scripts/parse_test_results.py

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  # =========================================================================
  # Job 2: Build Application APK (Runs only after Tests Pass)
  # =========================================================================
  build:
    name: 📦 Build Application APK
    needs: [test]
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=4"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Persistent Canonical Keystore & Environment
        run: |
          touch .env
          if [ -f "debug.keystore.base64" ]; then
            echo "Loading keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "Loading keystore from GitHub Secret DEBUG_KEYSTORE_BASE64..."
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          else
            echo "Restoring canonical project debug keystore from embedded signature..."
            echo "" | base64 -d > debug.keystore
          fi
          chmod +x gradlew

      - name: Build Application APK
        run: |
          BUILD_NUMBER="${{ github.run_number }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "Building debug APK with build number: $BUILD_NUMBER (commit: $SHORT_SHA)..."
          ./gradlew assembleDebug -PversionCode=$BUILD_NUMBER -PversionName=1.0.0 --no-daemon --stacktrace

      - name: Package & Validate Artifact
        run: |
          mkdir -p dist
          RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "::error::Debug APK not found in app/build/outputs/apk/debug"
            exit 1
          fi

          BUILD_NUMBER="${{ github.run_number }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          CLEAN_BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')

          FINAL_APK_NAME="Kalinal-build-${BUILD_NUMBER}-debug-${CLEAN_BRANCH}-${SHORT_SHA}.apk"
          cp "$RAW_APK" "dist/${FINAL_APK_NAME}"

          CHECKSUM=$(sha256sum "dist/${FINAL_APK_NAME}" | awk '{print $1}')
          FILE_SIZE=$(ls -lh "dist/${FINAL_APK_NAME}" | awk '{print $5}')

          echo "FINAL_APK_NAME=$FINAL_APK_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_ENV
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

          echo "Artifact prepared: dist/${FINAL_APK_NAME} (Size: $FILE_SIZE, SHA-256: $CHECKSUM)"

      - name: Upload Dynamic APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_APK_NAME }}
          path: dist/${{ env.FINAL_APK_NAME }}
          compression-level: 0
          retention-days: 14

      - name: Publish Build Step Summary
        if: always()
        run: |
          echo "## 📦 مشخصات بیلد خودکار اپلیکیشن (Automated Build Summary)" >> $GITHUB_STEP_SUMMARY
          echo "فایل نصبی اندروید به صورت پویا با موفقیت تولید شد:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| مشخصه | مقدار |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **نام فایل نصبی** | \`$FINAL_APK_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **شماره بیلد (Build)** | \`#$BUILD_NUMBER\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **شناسه کامیت (Git SHA)** | \`$SHORT_SHA\` (\`${{ github.sha }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **شاخه مخزن (Branch)** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **حجم فایل** | \`$FILE_SIZE\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **هش اعتبارسنجی (SHA-256)** | \`$CHECKSUM\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **نوع امضا** | 🛡️ کلید ثابت و یکپارچه دیباگ (امضای دائمی و سازگار با آپدیت‌ها) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **دانلود فایل نصبی:** از بخش **Artifacts** در بالای صفحه اجرای این اکشن قابل دریافت است." >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # Job 3: GitHub Wiki Synchronization (Runs independently)
  # =========================================================================
  wiki-sync:
    name: 📚 Sync Documentation to GitHub Wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone Wiki Repository & Sync Markdown Content
        env:
          WIKI_URL: https://x-access-token:${{ secrets.WIKI_SYNC_PAT || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: |
          WIKI_DIR="${{ runner.temp }}/wiki_repo"
          mkdir -p "$WIKI_DIR"

          echo "Attempting to clone repository wiki from: https://github.com/${{ github.repository }}.wiki.git"
          if ! git clone "$WIKI_URL" "$WIKI_DIR" 2>/dev/null; then
            echo "::warning::مخزن ویکی هنوز در گیت‌هاب ایجاد نشده است. برای فعال‌سازی به تب Wiki در مخزن بروید و یک صفحه اولیه ذخیره کنید."
            echo "## ⚠️ ویکی مخزن گیت‌هاب (GitHub Wiki) هنوز فعال نشده است" >> $GITHUB_STEP_SUMMARY
            echo "برای فعال‌سازی خودکار ویکی:" >> $GITHUB_STEP_SUMMARY
            echo "1. به زبانه **Wiki** در مخزن گیت‌هاب بروید (\`https://github.com/${{ github.repository }}/wiki\`)." >> $GITHUB_STEP_SUMMARY
            echo "2. روی **Create the first page** کلیک کرده و دکمه **Save Page** را بزنید." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "Wiki repository cloned successfully."
          cd "$GITHUB_WORKSPACE"
          echo "Copying documentation pages from docs/ to wiki..."

          find docs -type f -name "*.md" | while read -r file; do
            filename=$(basename "$file")
            if [ "$filename" = "README.md" ]; then
              cp "$file" "$WIKI_DIR/Home.md"
            else
              cp "$file" "$WIKI_DIR/$filename"
            fi
          done

          if [ -d "docs/images" ]; then
            cp -r docs/images "$WIKI_DIR/"
          fi

          cd "$WIKI_DIR"
          git add .

          if git diff --staged --quiet; then
            echo "No changes detected in documentation. Wiki is already up to date."
            echo "## ✅ ویکی گیت‌هاب به‌روز است و هیچ تغییری نیاز نبود." >> $GITHUB_STEP_SUMMARY
          else
            git commit -m "Auto-sync documentation from /docs (${{ github.sha }})"
            git push origin master || git push origin main || git push origin HEAD:master
            echo "Wiki synchronized successfully!"
            echo "## 🚀 مستندات با موفقیت به ویکی گیت‌هاب منتقل شدند!" >> $GITHUB_STEP_SUMMARY
            echo "می‌توانید مستندات را در [صفحه ویکی مخزن](https://github.com/${{ github.repository }}/wiki) مشاهده کنید." >> $GITHUB_STEP_SUMMARY
          fi
