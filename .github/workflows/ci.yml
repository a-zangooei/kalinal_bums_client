name: Android CI (Automated Tests & Build)

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: 🧪 Automated Quality Tests & App Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Ephemeral Keystore & Environment
        run: |
          touch .env
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Parse & Generate Dynamic Test Report Summary
        if: always()
        run: |
          python3 - << 'EOF'
          import os, glob, xml.etree.ElementTree as ET

          xml_files = sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml'))
          total_tests = 0
          total_failures = 0
          total_errors = 0
          total_skipped = 0
          total_time = 0.0
          suite_details = []

          for file_path in xml_files:
              try:
                  tree = ET.parse(file_path)
                  root = tree.getroot()
                  t = int(root.attrib.get('tests', 0))
                  f = int(root.attrib.get('failures', 0))
                  e = int(root.attrib.get('errors', 0))
                  s = int(root.attrib.get('skipped', 0))
                  tm = float(root.attrib.get('time', 0.0))
                  raw_name = root.attrib.get('name', os.path.basename(file_path))
                  short_name = raw_name.split('.')[-1]

                  total_tests += t
                  total_failures += f
                  total_errors += e
                  total_skipped += s
                  total_time += tm

                  status = "✅ پاس شد" if (f == 0 and e == 0) else "❌ خطا"
                  suite_details.append(f"| `{short_name}` | {t} | {t - f - e - s} | {f + e} | {s} | {tm:.2f}s | {status} |")
              except Exception as err:
                  print(f"Error parsing {file_path}: {err}")

          success_count = total_tests - total_failures - total_errors - total_skipped
          success_rate = (success_count / total_tests * 100) if total_tests > 0 else 0

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as out:
                  out.write("## 🧪 نتایج پویا و خودکار تست‌های واحد (Unit Tests Summary)\n\n")
                  out.write(f"- **کل آزمون‌ها:** `{total_tests}` مورد\n")
                  out.write(f"- **موفق (Passed):** `{success_count}` مورد (✅ {success_rate:.1f}%)\n")
                  out.write(f"- **ناموفق (Failed):** `{total_failures + total_errors}` مورد\n")
                  out.write(f"- **نادیده‌گرفته‌شده (Skipped):** `{total_skipped}` مورد\n")
                  out.write(f"- **زمان کل اجرا:** `{total_time:.2f}` ثانیه\n\n")

                  out.write("| کلاس آزمون (Test Suite) | کل تست‌ها | موفق | ناموفق | ردشده | مدت‌زمان | وضعیت |\n")
                  out.write("|---|:---:|:---:|:---:|:---:|:---:|:---:|\n")
                  for row in suite_details:
                      out.write(row + "\n")
                  out.write("\n")
          EOF

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build Application APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package & Sign Artifact with Dynamic Semantic Naming
        run: |
          mkdir -p dist
          RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "::error::Debug APK not found in app/build/outputs/apk/debug"
            exit 1
          fi

          # Extract Short Git Commit SHA and sanitized branch name
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          CLEAN_BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          VERSION_NAME="1.0"

          # Professional Semantic Name
          FINAL_APK_NAME="Kalinal-v${VERSION_NAME}-debug-${CLEAN_BRANCH}-${SHORT_SHA}.apk"
          cp "$RAW_APK" "dist/${FINAL_APK_NAME}"

          # Compute SHA-256 Checksum
          CHECKSUM=$(sha256sum "dist/${FINAL_APK_NAME}" | awk '{print $1}')
          FILE_SIZE=$(ls -lh "dist/${FINAL_APK_NAME}" | awk '{print $5}')

          echo "FINAL_APK_NAME=$FINAL_APK_NAME" >> $GITHUB_ENV
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_ENV
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

          echo "Artifact prepared: dist/${FINAL_APK_NAME} (Size: $FILE_SIZE, SHA-256: $CHECKSUM)"

      - name: Upload Dynamic APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_APK_NAME }}
          path: dist/${{ env.FINAL_APK_NAME }}
          retention-days: 14

      - name: Publish Comprehensive Build & Security Summary
        if: always()
        run: |
          echo "## 📦 مشخصات بیلد خودکار اپلیکیشن (Automated Build Summary)" >> $GITHUB_STEP_SUMMARY
          echo "فایل نصبی اندروید به صورت پویا و با نام‌گذاری استاندارد مبتنی بر کامیت کامپایل شد:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| مشخصه | مقدار |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **نام فایل نصبی** | \`$FINAL_APK_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **شناسه کامیت (Git SHA)** | \`$SHORT_SHA\` (\`${{ github.sha }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **شاخه مخزن (Branch)** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **حجم فایل** | \`$FILE_SIZE\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **هش اعتبارسنجی (SHA-256)** | \`$CHECKSUM\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **نوع امضا و کلید** | 🛡️ کلید موقت دیباگ (کلیدهای دائمی مخزن برای ریلیز رسمی ایزوله هستند) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **دانلود فایل نصبی:** از بخش **Artifacts** در بالای صفحه اجرای این اکشن قابل دریافت است." >> $GITHUB_STEP_SUMMARY
